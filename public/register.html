<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Crear una cuenta en MacroLog"
  >
  <title>Crear cuenta | MacroLog</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/register.js"></script>
</head>
<body class="auth-page">
  <header class="topbar">
    <a class="brand" href="/">MacroLog</a>
    <nav aria-label="Navegación principal">
      <a href="/login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <p class="eyebrow">Nueva cuenta</p>
      <h1>Empieza a controlar tu alimentación</h1>
      <p class="muted">
        Crea tu cuenta para registrar tus calorías y proteínas.
      </p>

      <form id="register-form" class="auth-form">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="password-confirmation">
          Repite la contraseña
        </label>
        <input
          id="password-confirmation"
          name="passwordConfirmation"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <p id="form-message" class="form-message" aria-live="polite"></p>

        <button id="submit-button" class="button" type="submit">
          Crear cuenta
        </button>
      </form>

      <p class="auth-link">
        ¿Ya tienes una cuenta?
        <a href="/login.html">Inicia sesión</a>
      </p>
    </section>
  </main>
</body>
</html>
